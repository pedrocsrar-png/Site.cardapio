<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Painel — Avenida</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f4efe6;font:16px/1.5 system-ui,sans-serif;padding:14px;max-width:900px;margin:auto}
h1{color:#f3d27a;font:700 22px Georgia,serif}input,select,textarea{background:#0f0e0d;color:#f4efe6;border:1px solid #5a4a24;border-radius:8px;padding:10px;font:16px inherit;width:100%;margin:3px 0 8px}
button{border:1px solid #d9a93b;color:#f3d27a;background:none;padding:10px 14px;border-radius:8px;font:600 15px inherit;cursor:pointer;min-height:42px}button.r{background:#d62d20;border-color:#d62d20;color:#fff}
.c{background:#161412;border:1px solid #d9a93b66;border-radius:12px;padding:12px;margin:10px 0}.c img{max-width:140px;border-radius:8px;display:block}label{font-size:13px;color:#a79f90}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.t{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.t button.on{background:#d9a93b33}.ck{display:flex;align-items:center;gap:6px}.ck input{width:auto;margin:0}.m{color:#7fe08a}.e{color:#ff8a80}</style></head><body>
<h1>Painel — Churrascaria e Pizzaria Avenida</h1><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const j=async(u,o={})=>{const r=await fetch(u,{...o,headers:{"Content-Type":"application/json"},body:o.body&&JSON.stringify(o.body)});const d=await r.json().catch(()=>({}));if(r.status===401&&u!=="/api/login"){login();throw new Error("auth")}if(!r.ok)throw new Error(d.error||"Erro");return d};
function login(msg){$("#app").innerHTML=`<div class="c"><label for="pw">Senha do administrador</label><input id="pw" type="password" autocomplete="current-password"><button class="r" id="go">Entrar</button><p class="e">${msg||""}</p></div>`;
const go=async()=>{try{await j("/api/login",{method:"POST",body:{password:$("#pw").value}});home()}catch(e){login(e.message)}};$("#go").onclick=go;$("#pw").onkeydown=e=>e.key==="Enter"&&go()}
let tab="p",rs="";
async function home(){$("#app").innerHTML=`<div class="t"><button data-t="p" class="${tab=='p'?'on':''}">Cardápio</button><button data-t="r" class="${tab=='r'?'on':''}">Avaliações</button><button data-t="s" class="${tab=='s'?'on':''}">Indicadores</button><button data-t="c" class="${tab=='c'?'on':''}">Contato</button><button id="lo">Sair</button></div><div id="v">Carregando…</div>`;
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;home()});$("#lo").onclick=async()=>{await j("/api/logout",{method:"POST"});login()};
try{if(tab==="p")await prods();else if(tab==="r")await revs();else if(tab==="c")await cfg();else await stats()}catch(e){if(e.message!=="auth"&&$("#v"))$("#v").innerHTML=`<p class="e">${esc(e.message)}</p>`}}
const form=p=>`<form class="c" data-id="${esc(p.id||"")}"><div class="row"><div><label>Nome</label><input name="name" value="${esc(p.name)}" required></div><div><label>Categoria</label><input name="cat" value="${esc(p.cat)}"></div><div><label>Preço (R$, vazio = "consulte")</label><input name="price" inputmode="decimal" value="${p.price_cents!=null?(p.price_cents/100).toFixed(2).replace(".",","):""}"></div></div>
<label>Descrição</label><textarea name="descr" rows="2">${esc(p.descr)}</textarea><div class="row"><div class="ck"><input type="checkbox" name="available" ${p.available!==false?"checked":""}> Disponível</div><div class="ck"><input type="checkbox" name="published" ${p.published!==false?"checked":""}> Publicado</div><div><label>Ordem</label><input name="sort" type="number" value="${p.sort||0}"></div></div>
${p.id?`${p.image?`<img src="${esc(p.image)}" alt="">`:""}<label>Trocar foto (JPG/PNG/WebP, até 5 MB)</label><input type="file" name="img" accept="image/*">`:'<p class="m">Salve primeiro; depois envie a foto.</p>'}
<button class="r">Salvar</button> ${p.id?`<button type="button" data-del="${esc(p.id)}">Arquivar</button> <small>${p.count||0} avaliações · média ${p.avg||"—"} · ${p.pending||0} pendentes</small>`:""}<span class="m"></span></form>`;
async function prods(){const l=await j("/api/admin/products");$("#v").innerHTML="<h2>Novo prato</h2>"+form({})+"<h2>Pratos</h2>"+l.map(form).join("");
document.querySelectorAll("form.c").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const o=f.elements,st=f.querySelector(".m");try{
const r=await j("/api/admin/products",{method:"POST",body:{id:f.dataset.id,name:o.name.value,cat:o.cat.value,price:o.price.value,descr:o.descr.value,available:o.available.checked,published:o.published.checked,sort:o.sort.value}});
const file=o.img&&o.img.files[0];if(file){const d=await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(file)});await j(`/api/admin/products/${r.id}/image`,{method:"POST",body:{data:d}})}
st.textContent=" Salvo!";if(!f.dataset.id||file)setTimeout(home,600)}catch(x){st.className="e";st.textContent=" "+x.message}});
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Arquivar este prato? Ele sai do site, mas os dados ficam salvos.")){await j("/api/admin/products/"+b.dataset.del,{method:"DELETE"});home()}})}
async function revs(){const l=await j("/api/admin/reviews"+(rs?"?status="+rs:""));$("#v").innerHTML=`<select id="fs">${[["","Todas"],["pending","Pendentes"],["approved","Aprovadas"],["hidden","Ocultas"],["rejected","Rejeitadas"]].map(([v,n])=>`<option value="${v}" ${rs==v?"selected":""}>${n}</option>`).join("")}</select>`+(l.length?l.map(r=>`<div class="c"><b>${esc(r.name)}</b> · ${"★".repeat(r.stars)} · ${esc(r.pname||r.product)} · <small>${new Date(r.ts).toLocaleString("pt-BR")} · ${r.status}${r.reports?` · <span class="e">${r.reports} denúncia(s)</span>`:""}</small><p>${esc(r.text)}</p><button data-s="approved:${r.id}">Aprovar</button> <button data-s="hidden:${r.id}">Ocultar</button> <button data-s="rejected:${r.id}">Rejeitar</button></div>`).join(""):"<p>Nenhuma avaliação.</p>");
$("#fs").onchange=e=>{rs=e.target.value;revs()};document.querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{const[s,id]=b.dataset.s.split(":");await j("/api/admin/reviews/"+id,{method:"POST",body:{status:s}});revs()})}
async function cfg(){const c=await j("/api/admin/settings");const F=[["whatsapp","WhatsApp (DDI+DDD+número, só dígitos)"],["phone1","Telefone 1"],["phone2","Telefone 2 (opcional)"],["address","Endereço"],["hours","Horário de funcionamento"],["google_review_url","Link para avaliar no Google (https://…)"],["google_profile_url","Link do Perfil da Empresa (https://…)"]];
$("#v").innerHTML=`<form class="c" id="cf">${F.map(([k,l])=>`<label>${l}</label><input name="${k}" value="${esc(c[k])}">`).join("")}<button class="r">Salvar</button> <span id="cm"></span></form>`;
$("#cf").onsubmit=async e=>{e.preventDefault();const b={};F.forEach(([k])=>b[k]=e.target.elements[k].value);try{await j("/api/admin/settings",{method:"POST",body:b});$("#cm").className="m";$("#cm").textContent=" Salvo!"}catch(x){$("#cm").className="e";$("#cm").textContent=" "+x.message}}}
async function stats(){const s=await j("/api/admin/stats");$("#v").innerHTML=`<div class="c"><b>Avaliações por status</b><br>${s.reviews.map(r=>`${r.status}: ${r.c}`).join(" · ")||"Nenhuma"}</div>`+s.perProduct.map(p=>`<div class="c">${esc(p.name)}: ${p.c} avaliações aprovadas, média ${p.a??"—"}</div>`).join("")+`<p class="m">Visitas e pedidos não são coletados (não foram implementados).</p>`}
j("/api/admin/stats").then(home).catch(()=>{});
</script></body></html>
